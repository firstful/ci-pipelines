name: build-python

# Reusable pipeline: build + push a Python service image to the Gitea registry.
# Call from an app repo:
#   jobs:
#     build:
#       uses: reeds/ci-pipelines/.gitea/workflows/build-python.yml@main
#       with:
#         image: reeds/vision            # required: registry path (no host)
#         # dockerfile: Dockerfile       # optional: custom Dockerfile path
#         # registry: 192.168.1.2:3000   # optional: registry host:port
#       secrets: inherit                 # needs REGISTRY_PUSH_TOKEN
#
# Tags pushed: :latest + :<sha8>. Bump the manifest tag (sha8) in
# sutliff-cluster to deploy — same-tag re-push does NOT re-pull.

on:
  workflow_call:
    inputs:
      image:
        description: Registry image path, e.g. reeds/vision (no host prefix)
        required: true
        type: string
      dockerfile:
        description: Dockerfile path relative to repo root
        required: false
        type: string
        default: Dockerfile
      registry:
        description: Container registry host[:port]
        required: false
        type: string
        default: 192.168.1.2:3000
    secrets:
      REGISTRY_PUSH_TOKEN:
        required: true

jobs:
  build:
    runs-on: [self-hosted]
    container:
      image: node:22-bookworm
      # NOTE: container.options REPLACES the runner's default options
      # (gradle-cache mount); the DinD socket lives in the runner pod's
      # shared emptyDir (/var/run) and must be re-mounted here.
      options: -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push image
        run: |
          set -e
          apt-get update -qq
          apt-get install -y -qq docker.io >/dev/null
          echo "${{ secrets.REGISTRY_PUSH_TOKEN }}" | docker login "${{ inputs.registry }}" -u reeds --password-stdin
          SHA8=$(echo "$GITHUB_SHA" | cut -c1-8)
          IMG="${{ inputs.registry }}/${{ inputs.image }}"
          docker build -f "${{ inputs.dockerfile }}" -t "${IMG}:latest" -t "${IMG}:${SHA8}" .
          docker push "${IMG}:latest"
          docker push "${IMG}:${SHA8}"
